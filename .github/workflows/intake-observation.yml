# Manual intake for browser-verified observations.
#
# The owner verifies a real product page in a browser (price, stock, CTA —
# only what is actually visible), then runs this workflow and pastes the
# observation in. The workflow POSTs it to /api/intake/observation using the
# owner's CRON_SECRET, so the secret is never exposed and the honest decision
# engine (rule 2.1.0) produces a real decision with auditable economics.
#
# Never invent a price, stock state, or limit: use inStock=false /
# quantityLimitKnown=false when the page did not show it.

name: intake-observation (verified, manual)

on:
  workflow_dispatch:
    inputs:
      brand:
        description: "Brand exactly as shown on the page"
        required: true
        type: string
      model:
        description: "Product name exactly as shown on the page"
        required: true
        type: string
      variant:
        description: "Variant label"
        default: "default"
        type: string
      category:
        description: "Category: toys, tech, watches, sneakers, ..."
        default: "other"
        type: string
      url:
        description: "Product page URL"
        required: true
        type: string
      seller:
        description: "Seller of record as shown on the page"
        required: true
        type: string
      priceUsd:
        description: "Observed price in USD (number only, no tax/shipping)"
        required: true
        type: string
      inStock:
        description: "Buy/Add-to-Bag button was enabled on the page"
        type: choice
        options: ["true", "false"]
        default: "true"
      verificationDepth:
        description: "How deep the verification went"
        type: choice
        options: ["listing", "cart", "checkout"]
        default: "listing"
      evidenceNote:
        description: "One sentence: what was actually seen on the page"
        required: true
        type: string
      quantityLimitKnown:
        description: "The page stated a quantity/purchase limit"
        type: choice
        options: ["true", "false"]
        default: "false"
      imageUrl:
        description: "Optional: product image URL copied from the verified page (https only)"
        required: false
        type: string
        default: ""

jobs:
  submit:
    runs-on: ubuntu-latest
    # Inputs go through env so bash never re-expands $ or other special
    # characters inside free-text fields (e.g. "price $39.99" in evidenceNote).
    env:
      IN_BRAND: ${{ inputs.brand }}
      IN_MODEL: ${{ inputs.model }}
      IN_VARIANT: ${{ inputs.variant }}
      IN_CATEGORY: ${{ inputs.category }}
      IN_URL: ${{ inputs.url }}
      IN_SELLER: ${{ inputs.seller }}
      IN_PRICE: ${{ inputs.priceUsd }}
      IN_STOCK: ${{ inputs.inStock }}
      IN_DEPTH: ${{ inputs.verificationDepth }}
      IN_NOTE: ${{ inputs.evidenceNote }}
      IN_QTY: ${{ inputs.quantityLimitKnown }}
      IN_IMAGE: ${{ inputs.imageUrl }}
    steps:
      - name: Submit verified observation to the honest engine
        run: |
          BODY=$(jq -n \
            --arg brand "$IN_BRAND" \
            --arg model "$IN_MODEL" \
            --arg variant "$IN_VARIANT" \
            --arg category "$IN_CATEGORY" \
            --arg url "$IN_URL" \
            --arg seller "$IN_SELLER" \
            --argjson priceUsd "$IN_PRICE" \
            --argjson inStock "$IN_STOCK" \
            --arg depth "$IN_DEPTH" \
            --arg note "$IN_NOTE" \
            --argjson qtyKnown "$IN_QTY" \
            --arg imageUrl "$IN_IMAGE" \
            '{brand:$brand, model:$model, variant:$variant, category:$category, url:$url, seller:$seller, priceUsd:$priceUsd, inStock:$inStock, verificationDepth:$depth, evidenceNote:$note, quantityLimitKnown:$qtyKnown, imageUrl:$imageUrl}')
          echo "Submitting observation:"
          echo "$BODY" | jq '{brand, model, priceUsd, inStock, verificationDepth, quantityLimitKnown}'
          echo "--- engine response:"
          # The stored CRON_SECRET may carry a stray trailing newline (pasted
          # blank line). A raw newline inside the header value ends the HTTP
          # headers prematurely, pushing the real headers into the request
          # body on POSTs (GETs are unaffected, which is why the collector
          # kept working). Strip whitespace defensively before sending.
          CLEAN_SECRET="$(printf '%s' "${{ secrets.CRON_SECRET }}" | tr -d '[:space:]')"
          curl -s -w '\nHTTP_STATUS:%{http_code}\n' -X POST "https://release-radar-v2.vercel.app/api/intake/observation" \
            -H "Authorization: Bearer ${CLEAN_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$BODY" | head -c 4000
          echo ""
